
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0c1b">
    <title>¡Feliz Cumpleaños!</title>

    <style>
        :root {
            --primary: #ff477e;
            --primary-hover: #ff2a63;
            --background: #0f0c1b;
            --card-bg: #1d1836;
            --text: #ffffff;
            --text-muted: #b9b4d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px 0;
        }

        #canvas-confetti {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        h1 {
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            text-align: center;
            background: linear-gradient(
                45deg,
                #ff477e,
                #ff85a2,
                #fbb1bd,
                #ff477e
            );
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            animation: gradient-fade 6s ease infinite, pulse 2s infinite;
            filter: drop-shadow(0 0 12px rgba(255, 71, 126, 0.2));
        }

        .card-scene {
            width: min(300px, 85vw);
            height: min(400px, 115vw);
            min-height: 340px;
            perspective: 1500px;
        }

        .card-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-container.open {
            transform: rotateY(-180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-front {
            background: linear-gradient(135deg, var(--card-bg), #251f47);
        }

        .gift-box {
            font-size: 5rem;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 15px rgba(255, 71, 126, 0.4));
        }

        .tap-instruction {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            animation: blink 1.5s infinite;
        }

        .card-back {
            background: linear-gradient(135deg, #251f47, var(--card-bg));
            transform: rotateY(180deg);
            text-align: center;
            justify-content: space-between;
            gap: 20px;
        }

        .decorations {
            font-size: 2rem;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .message {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .btn-surprise {
            position: relative;
            z-index: 3;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        .btn-surprise:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .btn-surprise:focus-visible,
        .card-container:focus-visible {
            outline: 3px solid #ff85a2;
            outline-offset: 5px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes gradient-fade {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas-confetti" aria-hidden="true"></canvas>

    <main class="container">
        <h1 id="title">¡Feliz Cumpleaños!</h1>

        <div class="card-scene">
            <div
                class="card-container"
                id="birthdayCard"
                role="button"
                tabindex="0"
                aria-label="Abrir tarjeta de cumpleaños"
                aria-expanded="false"
            >
                <div class="card-face card-front">
                    <div class="gift-box" aria-hidden="true">🎁</div>
                    <p class="tap-instruction">Haz clic para abrir</p>
                </div>

                <div class="card-face card-back">
                    <div class="decorations" aria-hidden="true">
                        🎈✨🎉
                    </div>

                    <p class="message">
                        Te deseo un día lleno de risas, sorpresas y momentos
                        inolvidables. ¡Que este nuevo año de vida venga
                        cargado de éxitos y mucha felicidad!
                    </p>

                    <button class="btn-surprise" id="confettiButton" type="button">
                        ¡Más confeti!
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Sistema de confeti
        const canvas = document.getElementById('canvas-confetti');
        const ctx = canvas.getContext('2d');

        const card = document.getElementById('birthdayCard');
        const title = document.getElementById('title');
        const confettiButton = document.getElementById('confettiButton');

        let particles = [];
        let isOpened = false;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);

            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class ConfettiParticle {
            constructor(x, y, isBurst = false) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.isBurst = isBurst;
                this.gravity = 0.06;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 3;

                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                } else {
                    this.speedX = Math.random() * 2 - 1;
                    this.speedY = Math.random() * 3 + 1.5;
                }

                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 6 - 3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;

                this.speedY += this.gravity;

                if (this.isBurst) {
                    this.speedX *= 0.99;
                    this.speedY *= 0.99;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;

                ctx.fillRect(
                    -this.size / 2,
                    -this.size / 2,
                    this.size,
                    this.size
                );

                ctx.restore();
            }
        }

        function spawnRain() {
            if (particles.length < 100) {
                particles.push(
                    new ConfettiParticle(
                        Math.random() * window.innerWidth,
                        -20
                    )
                );
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            spawnRain();

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];

                p.update();
                p.draw();

                if (
                    p.y > window.innerHeight + 30 ||
                    p.x < -30 ||
                    p.x > window.innerWidth + 30
                ) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        function burstConfettiAt(x, y, amount = 70) {
            // Evita acumular demasiadas partículas.
            const available = Math.max(0, 400 - particles.length);
            const count = Math.min(amount, available);

            for (let i = 0; i < count; i++) {
                particles.push(new ConfettiParticle(x, y, true));
            }
        }

        function toggleCard() {
            isOpened = !isOpened;

            card.classList.toggle('open', isOpened);
            card.setAttribute('aria-expanded', String(isOpened));

            title.textContent = isOpened
                ? '¡Muchas Felicidades!'
                : '¡Feliz Cumpleaños!';

            if (isOpened) {
                burstConfettiAt(
                    window.innerWidth / 2,
                    window.innerHeight / 2,
                    100
                );
            }
        }

        // Abrir o cerrar haciendo clic en la tarjeta.
        card.addEventListener('click', function (event) {
            // El botón interior tiene su propio comportamiento.
            if (event.target.closest('#confettiButton')) {
                return;
            }

            toggleCard();
        });

        // También permite usar la tarjeta con Enter o espacio.
        card.addEventListener('keydown', function (event) {
            if (event.target !== card) return;

            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleCard();
            }
        });

        // El botón genera confeti sin cerrar la tarjeta.
        confettiButton.addEventListener('click', function (event) {
            event.stopPropagation();

            const rect = confettiButton.getBoundingClientRect();

            burstConfettiAt(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2,
                100
            );
        });
    </script>
</body>
</html>
