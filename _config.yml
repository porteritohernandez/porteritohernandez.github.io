*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071016;color:#edf5f6;line-height:1.55}.root{min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(112,185,255,.14),transparent 34%),radial-gradient(circle at 10% 20%,rgba(101,230,181,.09),transparent 30%),#071016}.wrap{width:min(1120px,92%);margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(157,177,183,.16)}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}.nav a{color:var(--muted);text-decoration:none;margin-left:22px;font-size:.9rem}.nav a:hover{color:var(--text)}.hero{padding:86px 0 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:52px;align-items:center}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:.76rem;font-weight:800}.hero h1{font-size:clamp(3rem,7vw,6.2rem);line-height:.9;margin:15px 0 24px;letter-spacing:-.06em}.hero h1 em{font-style:normal;color:var(--accent2)}.lead{font-size:1.18rem;color:#c5d4d8;max-width:680px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:1px solid var(--line);padding:12px 17px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:700;background:var(--surface)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#062018}.hero-card{background:linear-gradient(145deg,rgba(17,36,45,.94),rgba(8,18,24,.96));border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{padding:20px;border:1px solid var(--line);border-radius:13px;background:rgba(13,26,33,.8)}.metric b{font-size:1.5rem;display:block}.metric small{color:var(--muted)}section{padding:70px 0;border-top:1px solid rgba(157,177,183,.12)}h2{font-size:2.1rem;letter-spacing:-.03em;margin:0 0 12px}.section-intro{color:var(--muted);max-width:720px;margin-bottom:30px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}.card h3{margin:0 0 8px}.card p{margin:0;color:var(--muted)}.arch{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:stretch}.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center}.node strong{display:block;margin-bottom:5px}.node small{color:var(--muted)}.arrow{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.5rem}.tag{display:inline-block;border:1px solid rgba(101,230,181,.35);color:var(--accent);border-radius:999px;padding:5px 9px;font-size:.72rem;margin:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{padding:0;margin:0;list-style:none}.list li{padding:12px 0;border-bottom:1px solid var(--line);color:#c7d5d8}.list li::before{content:"✓";color:var(--accent);margin-right:10px;font-weight:800}.cta{background:linear-gradient(120deg,#0d2224,#0d1a28);border:1px solid var(--line);border-radius:18px;padding:38px}.footer{padding:35px 0 55px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:20px}.muted{color:var(--muted)}@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:55px}.grid,.cards,.split{grid-template-columns:1fr}.arch{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:22px}.nav a{display:none}.footer{flex-direction:column}.hero-card{order:2}}
@media(prefers-color-scheme:light){:root{--bg:#f4f8f8;--surface:#fff;--surface2:#edf4f4;--text:#102027;--muted:#587078;--line:#d4e0e2}.root{background:radial-gradient(circle at 80% 0%,rgba(112,185,255,.15),transparent 34%),#f4f8f8}.hero-card{box-shadow:0 24px 80px rgba(28,60,70,.12)}.lead{color:#36515a}.node,.metric,.card{background:rgba(255,255,255,.82)}}
</style>
