<body>
<div class="root">
<header class="wrap nav"><div class="brand">RAIOTES<span>-RESCUE</span></div><nav><a href="#sistema">Sistema</a><a href="#arquitectura">Arquitectura</a><a href="#aplicaciones">Aplicaciones</a><a href="#tecnologia">Tecnología</a></nav></header>
<main>
<section class="wrap hero" style="border-top:0">
<div><div class="eyebrow">Plataforma tecnológica · InnovaTecNM 2026</div><h1>Percibir.<br><em>Procesar.</em><br>Responder.</h1><p class="lead">RAIOTES-RESCUE es un sistema de percepción y procesamiento diseñado para integrarse en plataformas robóticas que operan en escenarios de riesgo.</p><div class="buttons"><a class="btn primary" href="#sistema">Explorar el sistema</a><a class="btn" href="#arquitectura">Ver arquitectura</a></div></div>
<div class="hero-card"><div class="eyebrow">Concepto central</div><h3>Una tecnología adaptable a distintas plataformas</h3><p class="muted">La capacidad de percepción y procesamiento se concentra en una computadora de alto desempeño, permitiendo adaptar el sistema a diferentes configuraciones móviles según la contingencia.</p><div><span class="tag">LiDAR</span><span class="tag">Visión artificial</span><span class="tag">Termografía</span><span class="tag">IA</span><span class="tag">Robótica</span></div></div>
</section>
<section><div class="wrap grid"><div class="metric"><b>Percepción</b><small>Obtención de información del entorno</small></div><div class="metric"><b>Procesamiento</b><small>Fusión y análisis de datos</small></div><div class="metric"><b>Adaptabilidad</b><small>Integración con distintas plataformas</small></div></div></section>
<section id="sistema"><div class="wrap"><div class="eyebrow">01 · El sistema</div><h2>De datos del entorno a información útil</h2><p class="section-intro">El sistema combina sensores y algoritmos para generar una representación útil del entorno y apoyar la operación remota o autónoma de una plataforma robótica.</p><div class="cards"><article class="card"><h3>Percepción</h3><p>LiDAR, cámara termográfica y cámara convencional permiten obtener distancia, características visuales y condiciones térmicas.</p></article><article class="card"><h3>Procesamiento</h3><p>Una computadora Jetson concentra el procesamiento de percepción, visión artificial y lógica de operación.</p></article><article class="card"><h3>Comunicación</h3><p>La información procesada puede visualizarse y utilizarse para apoyar decisiones durante la intervención.</p></article></div></div></section>
<section id="arquitectura"><div class="wrap"><div class="eyebrow">02 · Arquitectura</div><h2>Arquitectura funcional</h2><p class="section-intro">El flujo está diseñado para separar adquisición, procesamiento y actuación, facilitando la integración del sistema en diferentes plataformas.</p><div class="arch"><div class="node"><strong>Sensores</strong><small>LiDAR · térmica · RGB</small></div><div class="arrow">→</div><div class="node"><strong>Jetson</strong><small>Procesamiento + IA</small></div><div class="arrow">→</div><div class="node"><strong>Salida</strong><small>Visualización · comandos</small></div></div><div style="height:16px"></div><div class="cards"><article class="card"><h3>Entrada</h3><p>Datos espaciales, visuales y térmicos obtenidos en tiempo real.</p></article><article class="card"><h3>Inteligencia</h3><p>Algoritmos de visión artificial y procesamiento local para interpretar el entorno.</p></article><article class="card"><h3>Integración</h3><p>La capa de procesamiento puede comunicarse con controladores de locomoción u otros módulos.</p></article></div></div></section>
<section id="tecnologia"><div class="wrap"><div class="eyebrow">03 · Tecnología</div><h2>Componentes tecnológicos</h2><div class="split"><div class="card"><h3>Hardware</h3><ul class="list"><li>Jetson Orin Nano como unidad de procesamiento</li><li>Sensor LiDAR para percepción espacial</li><li>Cámara termográfica para detección de condiciones térmicas</li><li>Cámara para visión artificial</li><li>Plataforma móvil y controladores de movimiento</li></ul></div><div class="card"><h3>Software</h3><ul class="list"><li>Visión artificial basada en modelos de detección</li><li>Procesamiento local de información</li><li>Interfaz de visualización y monitoreo</li><li>Comunicación entre módulos</li><li>Arquitectura modular para futuras integraciones</li></ul></div></div></div></section>
<section id="aplicaciones"><div class="wrap"><div class="eyebrow">04 · Aplicaciones</div><h2>Una plataforma para diferentes contingencias</h2><p class="section-intro">La misma arquitectura de percepción y procesamiento puede incorporarse a distintas plataformas móviles dependiendo de las condiciones de operación.</p><div class="cards"><article class="card"><h3>🔎 Búsqueda y rescate</h3><p>Exploración de zonas de difícil acceso y generación de información del entorno.</p></article><article class="card"><h3>🔥 Inspección en incendios</h3><p>Percepción térmica y visual para apoyar la evaluación de áreas de riesgo.</p></article><article class="card"><h3>🏚️ Derrumbes</h3><p>Navegación y percepción en espacios con obstáculos, escombros o accesos limitados.</p></article><article class="card"><h3>⚡ Inspección de infraestructura</h3><p>Observación remota de instalaciones o zonas donde la presencia humana implica riesgo.</p></article><article class="card"><h3>🌐 Escenarios de contingencia</h3><p>Arquitectura preparada para adaptar sensores, locomoción y módulos de operación.</p></article><article class="card"><h3>🧩 Integración</h3><p>El sistema puede plantearse como una capa tecnológica reutilizable sobre diferentes robots.</p></article></div></div></section>
<section><div class="wrap"><div class="cta"><div class="eyebrow">05 · Propuesta</div><h2>No es solamente un robot.</h2><p class="lead">RAIOTES-RESCUE busca desarrollar una <strong>plataforma tecnológica adaptable</strong>: percepción + procesamiento + inteligencia + comunicación, capaz de integrarse con diferentes sistemas robóticos según la necesidad.</p><div class="buttons"><a class="btn primary" href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false">Volver al inicio ↑</a></div></div></div></section>
</main>
